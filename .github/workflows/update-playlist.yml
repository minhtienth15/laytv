name: Update SB playlist

on:
  schedule:
    # GitHub Actions schedule uses UTC: 00:17, 06:17, 12:17, 18:17.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-sb-playlist
  cancel-in-progress: false

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Fetch API and generate playlist
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          if [[ -z "${API_URL:-}" ]]; then
            echo '::error::Missing repository secret API_URL. Add it in Settings > Secrets and variables > Actions.'
            exit 1
          fi

          python sb_scraper.py --output livingRoom.m3u

      - name: Commit playlist when changed
        run: |
          git add livingRoom.m3u

          if git diff --cached --quiet; then
            echo 'livingRoom.m3u is unchanged; no commit is needed.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update SB playlist'
          git push
