name: Refresh IPTV playlist

on:
  workflow_dispatch:
  schedule:
    # Runs every 30 minutes. GitHub may delay scheduled workflows during busy periods.
    - cron: '7,37 * * * *'

permissions:
  contents: read

concurrency:
  group: iptv-scraper
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch API data and generate playlist
        env:
          ROOMS_URL: ${{ secrets.ROOMS_URL }}
          API_BASE: ${{ secrets.API_BASE }}
          DETAIL_FILE: details.json
          PROXY_LIST_URL: ${{ secrets.PROXY_LIST_URL }}
        shell: bash
        run: |
          set +x
          if [[ -z "${PROXY_LIST_URL:-}" ]]; then
            export PROXY_LIST_URL="https://api.proxyscrape.com/v4/free-proxy-list/get?request=display_proxies&proxy_format=ipport&format=text&country=vn"
          fi
          if [[ -z "$ROOMS_URL" || -z "$API_BASE" ]]; then
            echo "Missing required repository secrets: ROOMS_URL and/or API_BASE" >&2
            exit 2
          fi
          python scraper.py --out output --workers 8 --timeout 15 --retries 3 --quality hd

      - name: Upload playlist artifact
        if: always() && hashFiles('output/playlist.m3u') != ''
        uses: actions/upload-artifact@v4
        with:
          name: iptv-playlist-${{ github.run_number }}
          path: |
            output/playlist.m3u
            output/channels.json
          if-no-files-found: warn
          retention-days: 3
